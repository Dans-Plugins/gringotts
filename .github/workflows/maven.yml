# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    # The dependency-graph step (pushes only) submits a snapshot, which needs write
    # access; this fork's default workflow token is read-only.
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # Every Bukkit class, field and method the jar uses must exist on each Minecraft
    # version in minecraft-versions.json.
    # See https://github.com/Dans-Plugins/release-gates#api-compatibility-check
    - name: Check Bukkit API use against every supported Minecraft version
      run: |
        curl -fsSL -o /tmp/check_api_compat.py \
          https://raw.githubusercontent.com/Dans-Plugins/release-gates/v14/gates/check_api_compat.py
        python3 /tmp/check_api_compat.py --versions minecraft-versions.json target

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive.
    # Only pushes to master submit a snapshot, and a failed submission (e.g. the dependency graph
    # being disabled on this fork) does not fail the build.
    - name: Update dependency graph
      if: github.event_name == 'push'
      continue-on-error: true
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
